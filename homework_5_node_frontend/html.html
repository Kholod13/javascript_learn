<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Node.js</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Node.js</h1>
        <button id="btnHello">Say hello!</button>
        <button id="btnId">Generate my id</button>
        <h3>Server: <span id="printServer"></span></h3>
        <form id="form">
            <h3>Input your firstname and generate lastname by your node server</h3>
            <div>
                <input id="fieldName" type="text" id="firstname" placeholder="Firstname">
                <button id="btnSend">send</button>
            </div>
            <h3>Your generated full name: <span id="fieldFullName"></span></h3>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
